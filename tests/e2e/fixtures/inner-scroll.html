<!doctype html>
<!-- Typical web app: the window never scrolls; a fixed app shell holds a
     header and a flex child with its own scrollbar. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Inner scroll container</title>
    <link rel="stylesheet" href="common.css" />
    <script src="common.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      .app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      .app > header {
        height: 56px;
        flex: none;
        background: #036;
        color: #fff;
      }
      .app > .body {
        display: flex;
        flex: 1 1 0;
        min-height: 0;
      }
      .app nav {
        width: 200px;
        overflow-y: auto;
      }
      .app main {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>Portal</header>
      <div class="body">
        <nav>Menu</nav>
        <main id="content"></main>
      </div>
    </div>
    <script>
      addParagraphs(document.getElementById('content'), 300);
    </script>
  </body>
</html>
