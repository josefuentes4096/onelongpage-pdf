<!doctype html>
<!-- Infinite-scroll style page: 100 rows, then 100 more each time the
     sentinel becomes visible, up to 300. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lazy window</title>
    <link rel="stylesheet" href="common.css" />
    <script src="common.js"></script>
  </head>
  <body style="margin: 0">
    <main id="content"></main>
    <div id="sentinel" style="height: 1px"></div>
    <script>
      const content = document.getElementById('content');
      let loaded = 0;
      const load = () => {
        addParagraphs(content, 100, loaded);
        loaded += 100;
      };
      load();
      new IntersectionObserver((entries, observer) => {
        if (!entries[0].isIntersecting) return;
        load();
        if (loaded >= 300) observer.disconnect();
      }).observe(document.getElementById('sentinel'));
    </script>
  </body>
</html>
